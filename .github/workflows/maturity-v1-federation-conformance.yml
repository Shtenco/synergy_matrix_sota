name: Maturity snapshot v1 federation conformance

on:
  pull_request:
    paths:
      - "sinergy_matrix_sota/core.py"
      - "sinergy_matrix_sota/snapshot.py"
      - "fixtures/conformance/maturity_snapshot_v1_callable_term_locked.json"
      - "tests/test_numeric_safety.py"
      - "tests/test_snapshot.py"
      - "tests/test_maturity_v1_conformance_fixture.py"
      - ".github/workflows/maturity-v1-federation-conformance.yml"
  workflow_dispatch:

concurrency:
  group: maturity-v1-federation-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maturity-v1-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile maturity domain producer
        run: >-
          python -m py_compile
          sinergy_matrix_sota/core.py
          sinergy_matrix_sota/snapshot.py

      - name: Run maturity domain and shared-fixture tests
        run: >-
          python -m pytest -q
          tests/test_numeric_safety.py
          tests/test_snapshot.py
          tests/test_maturity_v1_conformance_fixture.py
